version: '3'

services:
  nginx-rtmp:
    image: vallahaye/nginx-rtmp:stable-alpine
    container_name: nginx-rtmp
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./player:/mnt/player:ro
    ports:
      - "1935:1935"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
