<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoPro Stream — Video.js</title>
    <link href="/css/base.css" rel="stylesheet">
    <link href="/css/video-js.min.css" rel="stylesheet" />
    <script src="/js/video.min.js"></script>
    <script defer src="/js/alpine.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
    <style>
      body { display: flex; flex-direction: column; }
      .player-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .player-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 1200px; overflow: hidden; aspect-ratio: 16/9; }
      .video-js { width: 100% !important; height: 100% !important; }
      .vjs-tech { width: 100% !important; height: 100% !important; }
      .status-bar { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); }
      @media (max-width: 768px) {
        .player-wrapper { padding: 10px; }
        .status-bar { flex-direction: column; gap: 8px; text-align: center; }
      }
    </style>
  </head>
  <body x-data="player()" x-cloak>
    <div class="header">
      <h1>🎥 GoPro Stream — Video.js</h1>
      <nav class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/videojs.html" class="active">Video.js Player</a>
        <a href="/streamhls.html">HLS.js Player</a>
      </nav>
    </div>

    <div class="player-wrapper">
      <div class="player-container">
        <video
          id="player"
          class="video-js vjs-default-skin vjs-big-play-centered"
          controls
          autoplay
          muted
          preload="auto"
          data-setup='{}'
        >
          <source src="/hls/gopro.m3u8" type="application/x-mpegURL" />
        </video>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <span class="status-dot" :class="streamActive ? 'ok' : 'err'"></span>
        <span x-text="statusText">Verifica stream...</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span>HLS: /hls/gopro.m3u8</span>
        <button class="cmd-btn" :disabled="restartLoading" @click="restartStream()">
          <span x-show="!restartLoading">▶ Restart Stream</span>
          <span x-show="restartLoading">⏳ Invio...</span>
        </button>
        <span style="font-size: 0.75rem;" :style="{ color: restartOk ? '#00ff88' : restartErr ? '#ff4444' : '#ffaa00' }"
              x-text="restartMsg"></span>
      </div>
    </div>

    <script>
      function player() {
        return {
          streamActive: false,
          statusText: 'Verifica stream...',
          restartLoading: false,
          restartMsg: '',
          restartOk: false,
          restartErr: false,
          hlsUrl: '/hls/gopro.m3u8',

          init() {
            this.checkStream();
            setInterval(() => this.checkStream(), 5000);
          },

          async checkStream() {
            try {
              var res = await fetch(this.hlsUrl + '?t=' + Date.now(), { method: 'HEAD' });
              this.streamActive = res.ok;
              this.statusText = res.ok ? 'Stream attivo' : 'Stream non attivo';
            } catch (e) {
              this.streamActive = false;
              this.statusText = 'Stream non attivo';
            }
          },

          async restartStream() {
            this.restartLoading = true;
            this.restartMsg = 'Invio comando...';
            this.restartOk = false;
            this.restartErr = false;
            try {
              var res = await fetch('/api/cmd/execute?p1=gpStream&a1=proto_v2&c1=restart');
              this.restartOk = res.ok;
              this.restartErr = !res.ok;
              this.restartMsg = res.ok ? '✅ Comando inviato' : '❌ Errore: ' + res.status;
            } catch (e) {
              this.restartErr = true;
              this.restartMsg = '❌ Timeout/Errore connessione';
            }
            this.restartLoading = false;
            setTimeout(() => { this.restartMsg = ''; this.restartOk = false; this.restartErr = false; }, 3000);
          }
        };
      }
    </script>
  </body>
</html>
