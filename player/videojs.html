<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoPro Stream — Video.js</title>
    <link href="/css/video-js.min.css" rel="stylesheet" />
    <script src="/js/video.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
      .header { padding: 16px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
      .header h1 { font-size: 1.3rem; color: #fff; }
      .nav-links { display: flex; gap: 10px; }
      .nav-links a { color: #888; text-decoration: none; padding: 8px 16px; border: 1px solid #333; border-radius: 8px; font-size: 0.85rem; transition: all 0.2s; }
      .nav-links a:hover { color: #fff; border-color: #555; background: #1a1a1a; }
      .player-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .player-container { background: #1a1a1a; border-radius: 12px; border: 1px solid #333; overflow: hidden; width: 100%; max-width: 1200px; aspect-ratio: 16/9; position: relative; }
      .video-js { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      .status-bar { padding: 12px 20px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #888; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; display: inline-block; }
      .status-dot.ok { background: #00ff88; }
      .status-dot.err { background: #ff4444; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🎥 GoPro Stream — Video.js</h1>
      <nav class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/hlsjs.html">HLS.js Player</a>
      </nav>
    </div>

    <div class="player-wrapper">
      <div class="player-container">
        <video
          id="player"
          class="video-js vjs-default-skin vjs-big-play-centered"
          controls
          autoplay
          muted
          preload="auto"
          data-setup='{"fluid": true, "aspectRatio": "16:9"}'
        >
          <source src="/hls/gopro.m3u8" type="application/x-mpegURL" />
        </video>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Verifica stream...</span>
      </div>
      <div>HLS: /hls/gopro.m3u8</div>
    </div>

    <script>
      var statusDot = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var hlsUrl = '/hls/gopro.m3u8';

      function checkStream() {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', hlsUrl + '?t=' + Date.now());
        xhr.timeout = 3000;
        xhr.onload = function() {
          statusDot.className = 'status-dot ok';
          statusText.textContent = 'Stream attivo';
        };
        xhr.onerror = xhr.ontimeout = function() {
          statusDot.className = 'status-dot err';
          statusText.textContent = 'Stream non attivo';
        };
        xhr.send();
      }

      checkStream();
      setInterval(checkStream, 5000);
    </script>
  </body>
</html>
