<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoPro Stream — Dashboard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
      h1 { font-size: 1.5rem; margin-bottom: 20px; color: #fff; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
      .card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #333; }
      .card h2 { font-size: 1rem; color: #888; margin-bottom: 12px; }
      .status { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      .dot { width: 10px; height: 10px; border-radius: 50%; }
      .dot.ok { background: #00ff88; }
      .dot.err { background: #ff4444; }
      .dot.warn { background: #ffaa00; }
      .dot.off { background: #555; }
      .value { font-size: 1.2rem; font-weight: 600; }
      .label { font-size: 0.85rem; color: #888; }
      .stream-preview { width: 100%; border-radius: 8px; margin-top: 12px; background: #000; aspect-ratio: 16/9; object-fit: contain; }
      #log { font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: #111; padding: 10px; border-radius: 8px; margin-top: 12px; }
      .log-entry { margin: 2px 0; }
      .log-ok { color: #00ff88; }
      .log-err { color: #ff4444; }
      .log-info { color: #888; }
    </style>
  </head>
  <body>
    <h1>🎥 GoPro Stream Dashboard</h1>

    <div class="grid">
      <!-- Stream Status -->
      <div class="card">
        <h2>Stream Status</h2>
        <div class="status">
          <div class="dot" id="dot-hls"></div>
          <span>HLS Endpoint</span>
          <span class="value" id="val-hls">...</span>
        </div>
        <div class="status">
          <div class="dot" id="dot-rtmp"></div>
          <span>RTMP Endpoint</span>
          <span class="value" id="val-rtmp">...</span>
        </div>
        <div class="status">
          <div class="dot" id="dot-gopro"></div>
          <span>GoPro (10.5.5.9)</span>
          <span class="value" id="val-gopro">...</span>
        </div>
      </div>

      <!-- Stream Info -->
      <div class="card">
        <h2>Stream Info</h2>
        <div class="status">
          <span class="label">HLS URL:</span>
          <span class="value" style="font-size: 0.9rem; word-break: break-all;">
            <span id="hls-url">...</span>
          </span>
        </div>
        <div class="status">
          <span class="label">RTMP URL:</span>
          <span class="value" style="font-size: 0.9rem; word-break: break-all;">
            <span id="rtmp-url">...</span>
          </span>
        </div>
      </div>

      <!-- Log -->
      <div class="card" style="grid-column: 1 / -1;">
        <h2>Log</h2>
        <div id="log"></div>
      </div>
    </div>

    <script>
      var logEl = document.getElementById('log');
      var hlsUrl = window.location.origin + '/hls/gopro.m3u8';
      var rtmpUrl = 'rtmp://' + window.location.hostname + ':1935/live/gopro';

      document.getElementById('hls-url').textContent = hlsUrl;
      document.getElementById('rtmp-url').textContent = rtmpUrl;

      function addLog(msg, cls) {
        var d = document.createElement('div');
        d.className = 'log-entry ' + (cls || 'log-info');
        d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(dotId, valId, ok, text) {
        var dot = document.getElementById(dotId);
        var val = document.getElementById(valId);
        dot.className = 'dot ' + (ok === true ? 'ok' : ok === false ? 'err' : 'off');
        val.textContent = text;
      }

      function checkHLS() {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', hlsUrl + '?t=' + Date.now());
        xhr.timeout = 3000;
        xhr.onload = function() {
          setStatus('dot-hls', 'val-hls', true, 'Attivo');
          addLog('HLS endpoint raggiungibile', 'log-ok');
        };
        xhr.onerror = xhr.ontimeout = function() {
          setStatus('dot-hls', 'val-hls', false, 'Non attivo');
          addLog('HLS endpoint non raggiungibile', 'log-err');
        };
        xhr.send();
      }

      function checkGoPro() {
        // Non possiamo fare ping dal browser, mostriamo stato manuale
        setStatus('dot-gopro', 'val-gopro', null, 'Verifica manuale');
        addLog('GoPro: verifica con ./wifi-connect.sh', 'log-info');
      }

      function checkRTMP() {
        // RTMP non verificabile via HTTP, mostriamo stato
        setStatus('dot-rtmp', 'val-rtmp', null, 'Porta 1935');
        addLog('RTMP: ' + rtmpUrl, 'log-info');
      }

      // Check iniziale
      addLog('Dashboard avviata', 'log-info');
      checkHLS();
      checkRTMP();
      checkGoPro();

      // Check periodico HLS
      setInterval(checkHLS, 5000);
    </script>
  </body>
</html>
