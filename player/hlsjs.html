<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoPro Stream — HLS.js</title>
    <script src="/js/hls.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; }
      video { max-width: 100%; max-height: 100%; }
      #status { position: fixed; top: 10px; left: 10px; color: #0f0; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="status">Caricamento...</div>
    <video id="video" controls autoplay muted></video>

    <script>
      var video = document.getElementById('video');
      var status = document.getElementById('status');

      if (Hls.isSupported()) {
        var hls = new Hls({
          liveDurationInfinity: true,
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource('/hls/gopro.m3u8');
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          status.textContent = 'Streaming attivo';
          video.play();
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            status.textContent = 'Errore fatale: ' + data.type;
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari: supporto nativo HLS
        video.src = '/hls/gopro.m3u8';
        status.textContent = 'Streaming attivo (Safari)';
      } else {
        status.textContent = 'HLS non supportato dal browser';
      }
    </script>
  </body>
</html>
