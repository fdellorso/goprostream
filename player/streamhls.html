<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoPro Stream — HLS.js</title>
    <link href="/css/base.css" rel="stylesheet">
    <script src="/js/hls.min.js"></script>
    <style>
      body { display: flex; flex-direction: column; }
      .player-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .player-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 1200px; overflow: hidden; aspect-ratio: 16/9; }
      video { width: 100%; height: 100%; display: block; }
      .status-bar { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); }
      @media (max-width: 768px) {
        .player-wrapper { padding: 10px; }
        .status-bar { flex-direction: column; gap: 8px; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🎥 GoPro Stream — HLS.js</h1>
      <nav class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/videojs.html">Video.js Player</a>
        <a href="/streamhls.html" class="active">HLS.js Player</a>
      </nav>
    </div>

    <div class="player-wrapper">
      <div class="player-container">
        <video id="video" controls autoplay muted></video>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Verifica stream...</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span>HLS: /hls/gopro.m3u8</span>
        <button id="btn-restart" class="cmd-btn">
          ▶ Restart Stream
        </button>
        <span id="restart-status" style="font-size: 0.75rem;"></span>
      </div>
    </div>

    <script>
      var video = document.getElementById('video');
      var statusDot = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var hlsUrl = '/hls/gopro.m3u8';

      // --- HLS.js ---
      if (Hls.isSupported()) {
        var hls = new Hls({
          liveDurationInfinity: true,
          enableWorker: true,
          lowLatencyMode: true,
        });
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          statusDot.className = 'status-dot ok';
          statusText.textContent = 'Stream attivo';
          video.play();
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            statusDot.className = 'status-dot err';
            statusText.textContent = 'Errore: ' + data.type;
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari: supporto nativo HLS
        video.src = hlsUrl;
        statusDot.className = 'status-dot ok';
        statusText.textContent = 'Stream attivo (Safari)';
      } else {
        statusDot.className = 'status-dot err';
        statusText.textContent = 'HLS non supportato';
      }

      // --- Check stream ---
      function checkStream() {
        var xhr = new XMLHttpRequest();
        xhr.open('HEAD', hlsUrl + '?t=' + Date.now());
        xhr.timeout = 3000;
        xhr.onload = function() {
          if (xhr.status === 200) {
            statusDot.className = 'status-dot ok';
            statusText.textContent = 'Stream attivo';
          } else {
            statusDot.className = 'status-dot err';
            statusText.textContent = 'Stream non attivo';
          }
        };
        xhr.onerror = xhr.ontimeout = function() {
          statusDot.className = 'status-dot err';
          statusText.textContent = 'Stream non attivo';
        };
        xhr.send();
      }

      setInterval(checkStream, 5000);

      // --- Restart Stream ---
      var btnRestart = document.getElementById('btn-restart');
      var restartStatus = document.getElementById('restart-status');

      btnRestart.addEventListener('click', function() {
        btnRestart.disabled = true;
        restartStatus.textContent = 'Invio comando...';
        restartStatus.style.color = '#ffaa00';

        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/cmd/execute?p1=gpStream&a1=proto_v2&c1=restart', true);
        xhr.timeout = 5000;
        xhr.onload = function() {
          if (xhr.status === 200) {
            restartStatus.textContent = '✅ Comando inviato';
            restartStatus.style.color = '#00ff88';
          } else {
            restartStatus.textContent = '❌ Errore: ' + xhr.status;
            restartStatus.style.color = '#ff4444';
          }
          btnRestart.disabled = false;
          setTimeout(function() { restartStatus.textContent = ''; }, 3000);
        };
        xhr.onerror = xhr.ontimeout = function() {
          restartStatus.textContent = '❌ Timeout/Errore';
          restartStatus.style.color = '#ff4444';
          btnRestart.disabled = false;
          setTimeout(function() { restartStatus.textContent = ''; }, 3000);
        };
        xhr.send();
      });
    </script>
  </body>
</html>
