load_module modules/ngx_rtmp_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4000;

    # ─── Vecchia configurazione (commentata, backup) ───────
    # application live {
    #   live on;
    #   push rtmp://localhost:1935/show;
    # }
    # application show {
    #   live on;
    #   hls on;
    #   hls_path /mnt/hls/;
    #   dash on;
    #   dash_path /mnt/dash/;
    # }

    # ─── Nuova configurazione (unica application) ──────────
    application live {
      live on;
      drop_idle_publisher 10s;
      hls on;
      hls_fragment 1;
      hls_playlist_length 3;
      hls_path /mnt/hls/;
    }
  }
}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;

  server {
    listen 8080;

    location / {
      root /mnt/player;
      index dashboard.html;
    }

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
    }

    location /js/ {
      root /mnt/player;
    }

    location /css/ {
      root /mnt/player;
    }

    # ─── API: proxy diretto a GoPro (senza Python) ─────────
    location = /api/status {
      proxy_pass http://10.5.5.9/gp/gpControl/status;
      proxy_set_header Host 10.5.5.9;
    }

    location /api/cmd/ {
      # /api/cmd/command/shutter?p=1 → /gp/gpControl/command/shutter?p=1
      rewrite ^/api/cmd/(.*)$ /gp/gpControl/$1 break;
      proxy_pass http://10.5.5.9;
      proxy_set_header Host 10.5.5.9;
    }

    # ─── API: vecchio proxy Python (commentato, backup) ────
    # location /api/ {
    #   proxy_pass http://127.0.0.1:8081;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    # }
  }
}
