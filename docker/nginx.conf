load_module modules/ngx_rtmp_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4000;

    application live {
      live on;
      drop_idle_publisher 10s;
      push rtmp://localhost:1935/show;
    }

    application show {
      live on;
      deny play all;
      hls on;
      hls_fragment 1;
      hls_playlist_length 3;
      hls_path /mnt/hls/;
      dash on;
      dash_path /mnt/dash/;
      dash_fragment 1;
      dash_playlist_length 3;
    }
  }
}

http {
  sendfile on;
  tcp_nopush on;

  server {
    listen 8080;

    location / {
      root /mnt/player;
      index dashboard.html;
    }

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
    }

    location /js/ {
      root /mnt/player;
    }

    location /css/ {
      root /mnt/player;
    }
  }
}
