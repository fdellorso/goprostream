load_module modules/ngx_rtmp_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4000;
    ping 30s;

    # ─── Nuova configurazione (unica application) ──────────
    application live {
      live on;

      # Sicurezza: solo localhost puo pubblicare
      allow publish 127.0.0.1;
      deny publish all;

      # Stabilita: drop publisher idle dopo 30s
      drop_idle_publisher 30s;

      # Stabilita: disconnetti subscriber quando publisher muore
      idle_streams off;

      # HLS
      hls on;
      hls_fragment 3;
      hls_playlist_length 10;
      hls_sync 100ms;
      hls_path /mnt/hls/;
    }

    # ─── Statistiche RTMP ──────────────────────────────────
    # Accessibili via: curl http://localhost:8080/stat
    application stat {
      live on;
      allow 127.0.0.1;
      deny all;
    }
  }
}

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;

  # ─── Redirect HTTP → HTTPS ──────────────────────────────
  server {
    listen 8080;
    server_name ouya.fritz.box;

    # Dashboard e HLS accessibili anche su HTTP (per compatibilità)
    location / {
      root /mnt/player;
      index dashboard.html;
    }

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
    }

    location /js/ {
      root /mnt/player;
    }

    location /css/ {
      root /mnt/player;
    }

    # ─── API: proxy diretto a GoPro ───────────────────────
    location = /api/status {
      proxy_pass http://10.5.5.9/gp/gpControl/status;
      proxy_set_header Host 10.5.5.9;
    }

    location /api/cmd/ {
      rewrite ^/api/cmd/(.*)$ /gp/gpControl/$1 break;
      proxy_pass http://10.5.5.9;
      proxy_set_header Host 10.5.5.9;
    }

    # ─── Statistiche RTMP via HTTP ────────────────────────
    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }

    location /stat.xsl {
      root /usr/share/nginx/html;
    }
  }

  # ─── HTTPS ──────────────────────────────────────────────
  server {
    listen 8443 ssl;
    server_name ouya.fritz.box;

    # Certificati SSL
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Configurazione SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Dashboard
    location / {
      root /mnt/player;
      index dashboard.html;
    }

    # HLS endpoint
    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
    }

    location /js/ {
      root /mnt/player;
    }

    location /css/ {
      root /mnt/player;
    }

    # ─── API: proxy diretto a GoPro ───────────────────────
    location = /api/status {
      proxy_pass http://10.5.5.9/gp/gpControl/status;
      proxy_set_header Host 10.5.5.9;
    }

    location /api/cmd/ {
      rewrite ^/api/cmd/(.*)$ /gp/gpControl/$1 break;
      proxy_pass http://10.5.5.9;
      proxy_set_header Host 10.5.5.9;
    }

    # ─── Statistiche RTMP via HTTP ────────────────────────
    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }

    location /stat.xsl {
      root /usr/share/nginx/html;
    }
  }
}
