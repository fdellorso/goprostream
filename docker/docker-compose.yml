version: '3'

services:
  # ─── Nginx-RTMP: media server ─────────────────────────────
  nginx-rtmp:
    image: docker.io/vallahaye/nginx-rtmp:stable-alpine
    container_name: nginx-rtmp
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf
      - ../player:/mnt/player:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    ports:
      - "1935:1935"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─── GoPro Stream: bridge Python ──────────────────────────
  goprostream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: goprostream
    network_mode: host
    env_file:
      - ../.env
    depends_on:
      nginx-rtmp:
        condition: service_healthy
    restart: unless-stopped
