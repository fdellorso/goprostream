version: '3'

services:
  # ─── Nginx-RTMP: media server ─────────────────────────────
  nginx-rtmp:
    image: docker.io/vallahaye/nginx-rtmp:stable-alpine
    container_name: nginx-rtmp
    network_mode: host
    environment:
      - SERVER_NAME=${SERVER_NAME:-ouya.fritz.box}
      - GOPRO_IP=${GOPRO_IP:-10.5.5.9}
    volumes:
      - ../docker/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ../docker/entrypoint.sh:/docker-entrypoint-custom.sh
      - ../player:/mnt/player:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      # Certificati SSL
      - ${SSL_CERT_PATH:-/etc/letsencrypt/live/ouya.fritz.box/fullchain.pem}:/etc/nginx/ssl/fullchain.pem:ro,Z
      - ${SSL_KEY_PATH:-/etc/letsencrypt/live/ouya.fritz.box/privkey.pem}:/etc/nginx/ssl/privkey.pem:ro,Z
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    restart: unless-stopped

  # ─── GoPro Stream: bridge Python ──────────────────────────
  goprostream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    container_name: goprostream
    network_mode: host
    env_file:
      - ../.env
    depends_on:
      - nginx-rtmp
    restart: unless-stopped

  # ─── GoPro API: server leggero (bottle) ─── COMMENTATO ──
  # Si usa nginx proxy diretto a 10.5.5.9 invece di questo server
