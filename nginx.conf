load_module modules/ngx_rtmp_module.so;

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

# RTMP configuration
rtmp {
  server {
    listen 1935;
    chunk_size 4000;

    # App principale: riceve il flusso RTMP da FFmpeg
    application live {
      live on;
      drop_idle_publisher 10s;

      # Push all'app show per generare HLS
      push rtmp://localhost:1935/show;

      # Solo reti private possono pubblicare
      allow publish 127.0.0.1;
      allow publish 192.168.0.0/16;
      allow publish 172.16.0.0/12;
      allow publish 10.0.0.0/8;
      deny publish all;
    }

    # App show: genera HLS e DASH
    application show {
      live on;
      deny play all;

      hls on;
      hls_fragment 1;
      hls_playlist_length 3;
      hls_path /mnt/hls/;

      dash on;
      dash_path /mnt/dash/;
      dash_fragment 1;
      dash_playlist_length 3;
    }
  }
}

# HTTP configuration
http {
  sendfile on;
  tcp_nopush on;

  # Default: serve i player
  server {
    listen 8080;

    # Player HTML (default)
    location / {
      root /mnt/player;
      index hlsjs.html;
    }

    # Player statici (JS, CSS)
    location /js/ {
      root /mnt/player;
    }
    location /css/ {
      root /mnt/player;
    }

    # HLS fragments
    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Expose-Headers Content-Length;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Max-Age 1728000;
        add_header Content-Type text/plain;
        add_header Content-Length 0;
        return 204;
      }
    }

    # DASH fragments
    location /dash {
      types {
        application/dash+xml mpd;
        video/mp4 mp4;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin * always;
    }
  }
}
